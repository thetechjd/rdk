packages:
  - 'packages/*'
  - 'apps/*'

# apps/desktop pulls the Electron toolchain (@electron/rebuild, electron-builder),
# which depends on @electron/node-gyp — Electron's git-forked node-gyp. Allow that
# legitimate git subdep through the supply-chain check.
blockExoticSubdeps: false

allowBuilds:
  '@nestjs/core': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  electron: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

# These packages pull heavy native binaries.
# They are installed on-demand by rdk commands, not during workspace install.
neverBuiltDependencies:
  - '@xenova/transformers'
  - 'onnxruntime-node'
  - 'onnxruntime-web'
  - 'sharp'
  - 'ethers'

overrides:
  '@modelcontextprotocol/sdk': '1.12.1'

# Our own first-party package, published from Ascendant-Finance alongside this
# repo. The minimumReleaseAge policy exists to blunt supply-chain attacks via
# freshly-published third-party dependencies; without an exclusion here every
# contract release would block RDK's build for a day.
#
# Excluded by NAME, not name@version: `pnpm add` writes the pinned form but the
# lockfile verifier does not honour it, so a pinned entry still fails the check.
# The tradeoff is real — this waives the age check for any future version of this
# package — and it is acceptable only because we publish it ourselves.
minimumReleaseAgeExclude:
  - '@retrodeck/payments-contract'
